# Dependabot configuration — keeps npm dependencies up to date for the
# monorepo (root package.json + workspace packages: frontend, backend,
# engine, shared).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix(deps)"
      include: "scope"
    reviewers:
      - "infinitEnigma"
    labels:
      - "dependencies"
    ignore:
      # Keep the trading platform surgical: only minor/patch upgrades inside
      # a major line are auto-merged. Semver-major bumps land as review-only
      # PRs so contracts/migrations get human sign-off.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # `@types/node` is pinned by the root `overrides` ("~24.13.5") to dedupe
      # all workspaces onto one copy. Dependabot bumps the per-workspace ranges
      # but not the override, so the two drift and `npm ci` fails. Bump it
      # deliberately by editing the override + regenerating the lock.
      - dependency-name: "@types/node"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
