<!-- @format -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trade Bot - Kodiak Integration</title>

    <!-- Critical CSS - Load immediately for above-the-fold content -->
    <link rel="preload" href="/src/styles/critical.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/src/styles/critical.css"></noscript>

    <!-- Preload critical resources -->
    <link rel="modulepreload" href="/src/main.tsx">
    <link rel="modulepreload" href="/src/App.tsx">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Health check script - non-blocking -->
    <script>
    // Non-blocking health check using requestIdleCallback or setTimeout with lower priority
    (function() {
        const checkHealth = function() {
            fetch('/api/health-check', {
                method: 'GET',
                headers: { 'Cache-Control': 'no-cache' }
            })
            .then(response => {
                if (!response.ok) {
                    // Backend is down, redirect to maintenance
                    window.location.href = '/maintenance.html';
                }
                // If response is OK, continue loading React app normally
            })
            .catch(error => {
                // Network error, assume backend is down
                console.warn('Backend health check failed:', error);
                window.location.href = '/maintenance.html';
            });
        };

        // Use requestIdleCallback if available (non-blocking), fallback to setTimeout
        if ('requestIdleCallback' in window) {
            requestIdleCallback(checkHealth, { timeout: 2000 });
        } else {
            // Use setTimeout with longer delay to avoid blocking
            setTimeout(checkHealth, 500);
        }
    })();
    </script>

  </body>
</html>
